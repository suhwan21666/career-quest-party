/* 레이아웃: 모바일 앱 같은 한 칼럼 + 하단 탭. 두꺼운 아래 테두리의 '눌리는' 버튼이 게임 느낌을 만든다. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --ink:#1B2340; --muted:#5B6788; --line:#D9DFEF;
  --gold:#FFB800; --gold-deep:#C98A00; --gold-ink:#3A2800;
  --blue:#4263EB; --blue-deep:#2F47B8; --mint:#17A583; --mint-deep:#0E7A60; --coral:#F76707; --rose:#E64980;
  --soft:#E4E9F7; --shadow:rgba(27,35,64,.12);
  --f-display:'Jua','Noto Sans KR',system-ui,sans-serif; --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10152B; --surface:#1A2140; --ink:#EDF0FF; --muted:#9BA8D0; --line:#2C3662;
  --gold:#FFC93C; --gold-deep:#B5870A; --gold-ink:#2E2000;
  --blue:#6C8BFF; --blue-deep:#3F58C9; --mint:#2CD0A8; --mint-deep:#13896C; --coral:#FF8A3D; --rose:#FF6FA5;
  --soft:#242C54; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10152B; --surface:#1A2140; --ink:#EDF0FF; --muted:#9BA8D0; --line:#2C3662;
  --gold:#FFC93C; --gold-deep:#B5870A; --gold-ink:#2E2000;
  --blue:#6C8BFF; --blue-deep:#3F58C9; --mint:#2CD0A8; --mint-deep:#13896C; --coral:#FF8A3D; --rose:#FF6FA5;
  --soft:#242C54; --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent}
[data-a]{cursor:pointer}
:disabled{cursor:default}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-block:12px 96px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.hud{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 14px 10px 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hud .who{min-width:0;flex:1}
.hud .nm{font-family:var(--f-display);font-size:19px;line-height:1.15;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hud .nm small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.bar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--gold) 0 10px,#ffcf4d 10px 20px);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.mint i{background:repeating-linear-gradient(115deg,var(--mint) 0 10px,#35c9a5 10px 20px)}
.hud .xpt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px;flex-wrap:wrap;column-gap:10px}
.hud .xpt span{white-space:nowrap}
.lv{font-family:var(--f-display);width:44px;height:48px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:20px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.streak{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:15px;color:var(--coral);line-height:1;flex:none;min-width:38px}
.streak svg{width:22px;height:26px}

/* 섹션 */
.sec{margin-top:20px}
.sec>.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec h2{font-size:22px}
.sec .sub{font-size:13px;color:var(--muted)}

/* 퀘스트 카드 */
.q{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;transition:transform .2s}
.q .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.q .ic svg{width:24px;height:24px}
.q.act .ic{background:var(--blue)} .q.story .ic{background:var(--rose)} .q.com .ic{background:var(--mint)} .q.habit .ic{background:var(--coral)}
.q .tag{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q h3{font-size:19px;line-height:1.25;margin-top:1px}
.q p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.q .foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.reward{font-family:var(--f-display);font-size:16px;color:var(--gold-deep);display:flex;gap:6px;align-items:center}
.chip{font-size:12px;border-radius:99px;padding:1px 9px;background:var(--soft);color:var(--muted)}
.q.done{background:var(--soft);border-color:transparent;border-bottom-width:2px}
.q.done h3{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.q.done .ic{background:var(--muted)}
.q.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
.btn{border:0;border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-size:17px;background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue-deep)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-deep)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-deep)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 var(--gold-deep)}
.btn.sm.ghost{box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;transform:none;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-size:13px}

.opts{grid-column:1/-1;display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.45}
.opt:hover{border-color:var(--blue)}
.opt.res{cursor:default}
.opt.best{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,var(--surface))}
.opt.mine{border-color:var(--blue)}
.opt small{display:block;margin-top:4px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:16px}
.write{grid-column:1/-1;display:grid;gap:8px;margin-top:6px}
.ta{width:100%;min-height:84px;resize:vertical;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);line-height:1.5}
.ta:focus{border-color:var(--blue);outline:none}
.seeds{display:flex;gap:6px;flex-wrap:wrap}
.seed{background:var(--soft);border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px}
.seed:hover{border-color:var(--blue)}
.mine-text{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.chap{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.chap .ch{font-family:var(--f-display);font-size:14px;color:var(--rose);display:flex;gap:8px;justify-content:space-between}
.chap .sc{font-size:13px;color:var(--muted);margin-top:2px}
.chap .tx{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.hopt{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;display:grid;gap:2px}
.hopt:hover{border-color:var(--coral)}
.hopt b{font-family:var(--f-display);font-weight:400;font-size:17px}
.hopt span{font-size:13px;color:var(--muted)}
.hcur{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.stage{font-family:var(--f-display)}
.hstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.hstat b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink)}
.cue{font-size:13px;color:var(--muted);margin:2px 0 0}
.cue b{font-weight:500;color:var(--ink)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}

.allclear{background:linear-gradient(135deg,var(--blue),#7A5CFA);color:#fff;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.allclear h3{font-size:20px}

/* 파티 */
.chest{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.chest svg.cs{width:56px;height:56px;grid-row:span 3}
.chest .t{font-family:var(--f-display);font-size:18px}
.chest .go{grid-column:2}
.chest .xpt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.mem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 12px 8px 4px;margin-bottom:10px}
.mem.me{border-color:var(--blue)}
.mem .n{font-family:var(--f-display);font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.mem .d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dots{display:flex;gap:4px;margin-top:4px}
.dots b{width:12px;height:12px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dots b.on{background:var(--mint);border-color:var(--mint-deep)}
.say{font-size:13px;background:var(--bg);border-radius:10px;padding:3px 9px;margin-top:5px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--f-display);font-size:26px;letter-spacing:.14em;background:var(--soft);border-radius:10px;padding:2px 14px;user-select:all}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
.inp:focus{border-color:var(--blue);outline:none}
input,textarea,select{font-size:16px;font-family:inherit}
button,[data-a],label{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.panel{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:8px 12px}
.err{color:var(--coral);font-size:13px;min-height:1.3em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.inp{flex:1;min-width:120px}

/* 캐릭터 */
.hero{display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px 12px 16px;text-align:center}
.hero .stage{width:min(220px,60vw);filter:drop-shadow(0 8px 10px var(--shadow))}
.tier{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.slot{display:flex;gap:6px;align-items:center;border-radius:99px;padding:3px 12px;font-size:13px;background:var(--soft);color:var(--muted)}
.slot.on{background:color-mix(in srgb,var(--mint) 20%,var(--surface));color:var(--ink)}
.slot b{font-family:var(--f-display);font-weight:400}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--surface) inset}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:6px;font-family:var(--f-display)}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--surface)}
.radar{width:100%;max-width:300px;margin:0 auto;display:block}
.radar text{fill:var(--ink);font-family:var(--f-body);font-size:11px}

/* 도감 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.jc{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:6px 6px 10px;text-align:center;display:grid;justify-items:center;gap:0}
.jc[aria-pressed="true"]{border-color:var(--blue)}
.jc .jn{font-family:var(--f-display);font-size:16px;line-height:1.2}
.jc .js{font-size:11px;color:var(--muted)}
.jc svg{width:76px;height:96px}
.stamp{font-size:11px;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--muted);margin-top:4px}
.stamp.ok{background:var(--gold);color:var(--gold-ink)}

/* 탭 */
.fold>.fh{width:100%;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;margin:0}.fold>.fh h2{margin:0;font-size:17px}.fold>.fh .sub{margin-left:auto;font-size:12px;color:var(--muted)}.fold>.fh .ch{font-size:11px;color:var(--muted)}.fold[open],.fold>.fh[aria-expanded=true]{border-color:var(--blue)}.fold>.fh+*{margin-top:8px}
.evimg{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex:none}.evimg.ph{display:grid;place-items:center;font-size:22px;background:var(--soft)}.evd{margin-top:8px}.evd summary{cursor:pointer;font-size:14px;color:var(--blue)}.evb{margin-top:6px}.prfl{display:grid;gap:12px}.pr{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start}.pr .pt{min-width:0;overflow-wrap:anywhere}
.dcards{display:grid;gap:10px}.dc{display:grid;gap:2px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}.dc b{font-family:var(--f-display);font-size:17px}.dc span{font-size:14px;color:var(--muted)}.dc[aria-pressed=true]{border-color:var(--blue);background:var(--soft)}
.rates{display:grid;gap:12px}.rq{display:grid;gap:6px;font-size:14px}.rt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rt button{padding:10px 0;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}.rt button[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:#fff}
.kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv{display:grid;justify-items:center;padding:8px 4px;background:var(--soft);border-radius:12px}.kv b{font-size:17px}.kv span{font-size:12px;color:var(--muted)}
.chg{display:grid;gap:6px}.cr{display:grid;grid-template-columns:64px 1fr 1fr 28px;gap:6px;align-items:center;font-size:13px}.cr .cb{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.cr .cb i{display:block;height:100%;background:#9AA7C7}.cr .cb.now i{background:var(--coral)}.cr .up{color:var(--mint-deep);font-weight:700}.cr .dn{color:var(--rose)}
.chip.kind-i{background:#E3F0FF;color:#1D4F91}.chip.kind-d{background:#FFE9D6;color:#8A4B0F}
.corebox{text-align:left;margin:8px 0;padding:8px 12px;background:var(--soft);border-radius:12px;font-size:14px}.corebox ul,.corelist{margin:4px 0 0;padding-left:18px}.corelist{font-size:13px;color:var(--muted)}.exj{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;text-align:left}.exj .btn{margin-top:6px}
.grow{display:grid;gap:12px}.grow .g{display:grid;gap:4px}.grow .gk{display:flex;gap:6px;flex-wrap:wrap}
.subnav{margin:10px 0 0}.subnav button{flex:1}
.sent{display:grid;gap:10px}.sent .s{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:start}.sent .d{font-size:12px;color:var(--muted);padding-top:2px}.sent .tx{font-size:14px;overflow-wrap:anywhere}
.lad{display:grid;gap:8px}.lad .r{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}.lad .r.ok{border-color:var(--blue)}.lad .r.lock{opacity:.55}.lad .hl{font-family:var(--f-display);color:var(--blue)}.lad .st{font-size:13px;color:var(--muted);white-space:nowrap}.trail{gap:0;margin-top:10px}.trail .tn{display:grid;grid-template-columns:44px 1fr;gap:10px;width:100%;text-align:left;border:0;background:none;padding:0 0 12px;margin:0;position:relative;align-items:start}
.trail .tn::before{content:"";position:absolute;left:21px;top:40px;bottom:-2px;width:4px;border-radius:4px;background:var(--line)}.trail .tn:last-child::before{display:none}.trail .tn.ok::before{background:var(--blue)}
.tdot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;background:var(--surface);border:3px solid var(--line);color:var(--muted);position:relative;z-index:1}
.tdot.ok{background:var(--blue);border-color:var(--blue);color:#fff;font-size:20px}.tdot.cur{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}.tdot.open{border-color:var(--coral);color:var(--coral)}.tdot.lock{opacity:.55;border-style:dashed}
.tcard{display:grid;gap:4px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}.tcard b{font-family:var(--f-display);font-weight:400;font-size:16px}.tcard.ok{border-color:var(--blue)}.tcard.cur{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 8%,var(--bg))}.tcard.lock{opacity:.6}
.tn.open:hover .tcard{border-color:var(--coral)}.tn:disabled{cursor:default}.tmeta{display:flex;flex-wrap:wrap;gap:4px}.tmeta .chip{font-size:11px}.tmeta .now{background:var(--coral);color:#fff}.tmeta .okc{background:var(--blue);color:#fff}.tsub{font-size:13px;color:var(--muted)}
.tphase{font-size:12px;letter-spacing:.02em;font-weight:700;margin:4px 0 8px;padding:4px 10px;border-radius:9px;width:max-content;max-width:100%}.tphase.i{background:color-mix(in srgb,var(--blue) 12%,var(--bg));color:var(--blue)}.tphase.d{background:color-mix(in srgb,var(--coral) 14%,var(--bg));color:var(--coral)}
.rib{display:flex;align-items:center;gap:0;margin:8px 0;max-width:100%}.rib u{flex:1;height:3px;background:var(--line);min-width:3px}.rib .rs i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-size:11px;font-family:var(--f-display);border:2px solid var(--line);background:var(--surface);color:var(--muted)}.rib .rs.ok i{background:var(--blue);border-color:var(--blue);color:#fff}.rib .rs.cur i{background:var(--coral);border-color:var(--coral);color:#fff}.rib .rs.open i{border-color:var(--coral);color:var(--coral)}.rib .rs.lock i{opacity:.55;font-size:10px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--coral)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:6px 0 4px;display:grid;justify-items:center;gap:1px;color:var(--muted);font-family:var(--f-display);font-size:13px;position:relative}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--blue);background:var(--soft)}
nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--coral);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--f-body)}

/* 모달 / 토스트 */
.ov{position:fixed;inset:0;background:rgba(10,14,34,.6);z-index:30;display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:18px;border:2px solid var(--line);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:26px;margin-bottom:6px}
.center{text-align:center;display:grid;justify-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 18px;font-family:var(--f-display);font-size:17px;z-index:40;animation:tst 2.2s forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.aura{animation:aura 2.4s ease-in-out infinite;transform-origin:50% 60%}
@keyframes aura{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.06)}}
.confetti i{position:absolute;width:8px;height:12px;top:30%;left:50%;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 시작 화면 */
.setup h1{font-size:34px;line-height:1.15;margin-top:10px}
.setup .lead{margin:8px 0 16px;color:var(--muted)}
.preview{display:grid;place-items:center;background:var(--soft);border-radius:18px;padding:8px}
.preview svg{width:150px}

.world{position:fixed;inset:0;z-index:25;background:#CFE3F5;touch-action:none;overscroll-behavior:none}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wtop{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.wtop>*{pointer-events:auto}
.wchip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:14px;color:var(--ink);min-width:0}
.wchip span{color:var(--muted);font-size:13px}
.wbot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none;max-width:520px;margin:0 auto}
.wbot>*{pointer-events:auto}
.wcard{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;color:var(--ink);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wcard[hidden]{display:none}
.wcard .wt{font-family:var(--f-display,inherit);font-size:18px}
.wcard .wi{font-size:14px;color:var(--muted)}
.wcard .wa{font-size:14px}
.whint{align-self:center;background:rgba(27,35,64,.82);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px}
.wcard{max-height:44vh;overflow:auto}.wcard .hrow+.hrow{margin-top:5px}
.hrow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:5px 9px;font-size:14px;color:var(--ink);font:inherit}
.hrow .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;color:#fff;font-size:14px}
.hrow.on{opacity:.8}.hrow.on .ck{background:var(--mint-deep);border-color:var(--mint-deep)}
.hrow .ht{flex:1;min-width:0;display:grid}.hrow small{color:var(--muted);font-size:11.5px}.hrow .hx{color:var(--gold-deep);font-weight:700;font-size:13px}
.alrow2{display:flex;gap:8px;align-items:center;font-size:13px;width:100%}.alrow2 .inp{width:auto;padding:4px 6px;margin-left:auto}
.alrow{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.lookprev{display:grid;justify-items:center;gap:8px;margin-bottom:12px;padding:8px;background:var(--soft);border-radius:16px}.lookprev .lp{width:132px}.sw{flex-wrap:wrap}
.chipbtn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px}.chipbtn[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.plgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.plbtn{display:grid;gap:2px;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);font:inherit}.plbtn span{font-size:12px;color:var(--muted)}.plbtn i{font-style:normal;font-size:13px;color:var(--mint-deep);font-weight:700}
.wsay{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wsay::-webkit-scrollbar{display:none}
.wsay .btn{flex:none;white-space:nowrap;padding:7px 11px;font-size:13px}
@keyframes whf{to{opacity:0;visibility:hidden}}
.whint{animation:whf .5s 7s forwards}
html.wopen,html.wopen body{overflow:hidden;height:100%}
.wnote{align-self:center;font-size:11px;color:#3a4766;background:rgba(255,255,255,.7);border-radius:8px;padding:2px 8px}
